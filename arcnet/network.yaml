# Shared network template. Private identifiers are placeholders; operator credentials remain outside Git.
name: mp-lb

# Template vars. gcp-project encodes our convention: one GCP project per code
# project, mp-lb-<slug> — the per-project inventory, drift and teardown unit.
region: asia-southeast1
# AWS region for aws-s3 buckets — matches the legacy manual bucket's region.
aws-region: ap-southeast-1
gcp-project: arcnet-{slug}
network-project: mp-lb-arcnet
billing-account: REPLACE_BILLING_ACCOUNT

dns:
  zone: mp-lb.dev

env:
  resolver: dx decrypt --file docs/secrets.json.enc
  public-file: .env.production

backend:
  gcs:
    bucket: mp-lb-arcnet-terraform-state
    prefix: terraform/state/{slug}

# Image template; arc appends /<service>:<tag>.
registry: "{region}-docker.pkg.dev/{gcp-project}/{slug}"

providers:
  google:
    source: hashicorp/google
    version: "~> 5.0"
    config:
      project: "{gcp-project}"
      region: "{region}"
      # Stamped on every label-supporting resource — the cross-check on top
      # of the per-project boundary.
      default_labels:
        source: arcnet
        project: "{slug}"
      # Send the project as quota project on API requests — required by some
      # APIs (e.g. billingbudgets) when authenticating with user ADC.
      user_project_override: true
      # Quota project must always exist — the per-project one doesn't yet
      # during its own creation. The network project is the stable home.
      billing_project: "{network-project}"
  cloudflare:
    source: cloudflare/cloudflare
    version: "~> 4.0"
    config:
      api_token: "{{cred.CLOUDFLARE_API_TOKEN}}"
  vercel:
    source: vercel/vercel
    version: "~> 1.0"
    config:
      api_token: "{{cred.VERCEL_API_TOKEN}}"
  upstash:
    source: upstash/upstash
    version: "~> 1.0"
    config:
      email: "{{cred.UPSTASH_EMAIL}}"
      api_key: "{{cred.UPSTASH_API_KEY}}"
  mongodbatlas:
    source: mongodb/mongodbatlas
    version: "~> 1.0"
    config:
      public_key: "{{cred.MONGODB_ATLAS_PUBLIC_KEY}}"
      private_key: "{{cred.MONGODB_ATLAS_PRIVATE_KEY}}"
  aws:
    source: hashicorp/aws
    version: "~> 5.0"
    config:
      region: "{aws-region}"
      default_tags:
        tags:
          source: arcnet
          project: "{slug}"
      # Optional static operator keys; unset renders empty and the provider
      # falls back to ambient AWS config (profile/SSO).
      access_key: "{{cred.ARC_AWS_ACCESS_KEY_ID}}"
      secret_key: "{{cred.ARC_AWS_SECRET_ACCESS_KEY}}"

# Network facts each module needs; merged under the deploy block's params.
module-defaults:
  github-ci:
    gcp-project-id: "{gcp-project}"
    state-bucket: mp-lb-arcnet-terraform-state
    network-project: "{network-project}"
    billing-account: "{billing-account}"
  gcp-project:
    project-id: "{gcp-project}"
    billing-account: "{billing-account}"
  gcp-budget:
    billing-account: "{billing-account}"
    gcp-project: "{gcp-project}"
    currency: AUD # the billing account's currency
  project-base:
    region: "{region}"
  cloud-run-web:
    gcp-project-id: "{gcp-project}"
    region: "{region}"
  gce-worker:
    region: "{region}"
  shared-mongo-atlas:
    atlas-project-id: "REPLACE_ATLAS_PROJECT_ID"
    cluster-host: REPLACE_ATLAS_CLUSTER_HOST
