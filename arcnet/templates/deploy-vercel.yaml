name: Deploy ArcNet static sites
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arcnet-vercel-production
  cancel-in-progress: false
jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.config.outputs.approved }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .arcnet/run.mjs check
      - id: config
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const c = JSON.parse(fs.readFileSync('.arcnet/project.json', 'utf8'));
          const ready = c.approved === true && Object.values(c.sites).every(s => s.mode === 'existing');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `approved=${ready}\n`);
          if (!ready) console.log('Deploy disabled: review references/approval; create new projects explicitly before enabling CI.');
          JS
  deploy:
    needs: configuration
    if: needs.configuration.outputs.approved == 'true' && github.ref == 'refs/heads/main'
    environment: arcnet-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Deploy referenced static sites
        run: node .arcnet/run.mjs deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
