name: Deploy ArcNet project
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arcnet-production
  cancel-in-progress: false
jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.config.outputs.approved }}
      provider: ${{ steps.config.outputs.provider }}
      account: ${{ steps.config.outputs.account }}
      registry: ${{ steps.config.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .arcnet/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm -C .arcnet install --ignore-workspace --frozen-lockfile
      - run: node .arcnet/run.mjs check
      - id: config
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { createRequire } from 'node:module';
          const require = createRequire(`${process.cwd()}/.arcnet/package.json`);
          const { parse } = require('yaml');
          const c = JSON.parse(fs.readFileSync('.arcnet/project.json', 'utf8'));
          const n = parse(fs.readFileSync('.arcnet/network.yaml', 'utf8'));
          if (!/^[a-z]+-[a-z]+[0-9]$/.test(n.region)) throw Error('Invalid region');
          if (c.approved === true && (!/^projects\/\d+\/locations\/global\/workloadIdentityPools\/github\/providers\/github-actions$/.test(c.workloadIdentityProvider) || !/^arc-deploy@[a-z][a-z0-9-]+\.iam\.gserviceaccount\.com$/.test(c.serviceAccount))) throw Error('Complete WIF configuration before approval');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `approved=${c.approved === true}\nprovider=${c.approved === true ? c.workloadIdentityProvider : ''}\naccount=${c.approved === true ? c.serviceAccount : ''}\nregistry=${n.region}-docker.pkg.dev\n`);
          if (c.approved !== true) console.log('Deployment disabled: complete ArcNet prerequisites and explicit approval first.');
          JS
  deploy:
    needs: configuration
    if: needs.configuration.outputs.approved == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: arcnet-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .arcnet/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm -C .arcnet install --ignore-workspace --frozen-lockfile
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ needs.configuration.outputs.provider }}
          service_account: ${{ needs.configuration.outputs.account }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$REGISTRY" --quiet
        env:
          REGISTRY: ${{ needs.configuration.outputs.registry }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - run: pnpm install --frozen-lockfile
      - name: Deploy selected services
        run: node .arcnet/run.mjs deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          UPSTASH_EMAIL: ${{ secrets.UPSTASH_EMAIL }}
          UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
          MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
          MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
          ARC_AWS_ACCESS_KEY_ID: ${{ secrets.ARC_AWS_ACCESS_KEY_ID }}
          ARC_AWS_SECRET_ACCESS_KEY: ${{ secrets.ARC_AWS_SECRET_ACCESS_KEY }}
          ARCNET_ENV_JSON: ${{ secrets.ARCNET_ENV_JSON }}
