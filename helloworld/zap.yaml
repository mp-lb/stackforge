project: hello-world
env-files:
  - .env.local
  - .env
ports:
  - API_PORT
  - WORKER_PORT
  - WEB_PORT
  - ADMIN_PORT
  - DOCS_PORT
  - MONGO_PORT
native:
  api:
    cmd: pnpm --filter @hello-world/hello-world-api dev
    env: "*"
  worker:
    cmd: pnpm --filter @hello-world/hello-world-worker dev
    env: "*"
  web:
    cmd: pnpm --filter @hello-world/hello-world-web dev --host 0.0.0.0 --port ${WEB_PORT}
    env: "*"
  admin:
    cmd: pnpm --filter @hello-world/hello-world-admin dev --hostname 0.0.0.0 --port ${ADMIN_PORT}
    env: "*"
  docs:
    cmd: pnpm --filter @hello-world/hello-world-docs dev
    env: "*"
docker:
  mongodb:
    aliases: [db]
    image: mongo:latest
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodb-data:/data/db
tasks:
  context-build:
    cmds:
      - node scripts/context-files.mjs build {{REST}}
  context-copy:
    cmds:
      - node scripts/context-files.mjs copy {{REST}}
  compile-agents:
    cmds:
      - zap task context-build -- {{REST}}
  setup:
    cmds:
      - pnpm install
  build:
    cmds:
      - pnpm build
  lint:
    cmds:
      - |
        if [ -n "{{REST}}" ]; then
          pnpm exec eslint {{REST}}
        else
          pnpm lint
        fi
  check:
    cmds:
      - zap task lint -- {{REST}}
      - pnpm typecheck
  typecheck:
    cmds:
      - pnpm typecheck
  test:
    cmds:
      - pnpm test
  worktree-setup:
    cmds:
      - pnpm install
      - cp "$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")/.env" . 2>/dev/null || true
      - '[ ! -f AGENTS.base.md ] || zap task context-copy'
      - grep -qxF '@AGENTS_WORKTREE.md' AGENTS.md || printf '\n@AGENTS_WORKTREE.md\n' >> AGENTS.md
