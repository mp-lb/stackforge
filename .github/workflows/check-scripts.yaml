name: Check scripts and starter shell

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [fssstack/shell, fssstack-mobile/packages/scripts]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ matrix.directory }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: fssstack/shell/.node-version
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ matrix.directory }}
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm --if-present build
        working-directory: ${{ matrix.directory }}
