name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Run from RUNNER_TEMP: the repo .npmrc routes the @mp-lb scope to
      # GitHub Packages, but these tools live on the public npm registry.
      - name: Decrypt shared secrets
        env:
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
        run: |
          cd "$RUNNER_TEMP"
          npx -y @mp-lb/doctrine-secrets decrypt "$GITHUB_WORKSPACE/docs/secrets.json.enc" --secret "$SECRETS_KEY" > "$RUNNER_TEMP/secrets.json"

      # Call the mapper's cli.js through node directly: the published bin
      # guard (`process.argv[1].endsWith("cli.js")`) silently no-ops when run
      # via the .bin symlink, e.g. through npx.
      - name: Load env (ci)
        run: |
          cd "$RUNNER_TEMP"
          npm install --prefix "$RUNNER_TEMP/env-mapper" @mp-lb/tools-env-mapper > /dev/null
          node "$RUNNER_TEMP/env-mapper/node_modules/@mp-lb/tools-env-mapper/dist/cli.js" github-env ci \
            --secrets "$RUNNER_TEMP/secrets.json" \
            --public "$GITHUB_WORKSPACE/.env.production" \
            --map "$GITHUB_WORKSPACE/env-map.yaml"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Expo doctor
        run: npx expo-doctor
