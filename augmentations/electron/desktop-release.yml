name: Release desktop
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
env:
  DESKTOP_RELEASE_REPOSITORY: mp-lb/example-releases
jobs:
  desktop-macos:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-6vcpu-macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @example/desktop typecheck
      - run: pnpm --filter @example/desktop build
      - name: Load and validate signing credentials
        env:
          ARCNET_STANDARD_SECRETS_KEY: ${{ secrets.ARCNET_STANDARD_SECRETS_KEY }}
          ARCNET_PROJECT_SECRETS_KEY: ${{ secrets.ARCNET_PROJECT_SECRETS_KEY }}
        run: |
          set -euo pipefail
          pnpm exec arcnet env export --consumer desktop | pnpm exec code-signing github-env --stdin
      - name: Package signed app
        run: pnpm --filter @example/desktop exec electron-builder --mac --arm64 --publish never
      - name: Verify artifacts
        run: |
          test -f apps/desktop/out/latest-mac.yml
          ls apps/desktop/out/*.dmg apps/desktop/out/*.zip
          APP=$(find apps/desktop/out -path '*.app' -type d -print -quit)
          test -n "$APP"
          codesign --verify --deep --strict "$APP"
          spctl --assess --type execute "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          if-no-files-found: error
          path: |
            apps/desktop/out/Example-arm64.dmg
            apps/desktop/out/Example-arm64.zip
            apps/desktop/out/latest-mac.yml

  desktop-linux:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Install Linux build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-0t64 libnss3 libgbm1 libasound2t64 rpm cpio

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm --filter @example/desktop build

      - name: Package Example Desktop
        working-directory: apps/desktop
        run: |
          pnpm exec electron-builder --linux deb --x64 --publish never
          pnpm exec electron-builder --linux rpm --x64 --publish never -c.directories.output=out/rpm

      - name: Assemble the Linux update manifest
        run: |
          pnpm exec tsx apps/desktop/scripts/writeLinuxUpdateManifest.ts \
            apps/desktop/out/Example-linux-amd64.deb \
            apps/desktop/out/rpm/Example-linux-x86_64.rpm \
            apps/desktop/out/latest-linux.yml
          cp apps/desktop/out/rpm/Example-linux-x86_64.rpm apps/desktop/out/

      - name: Verify Debian package and bundled runtime
        run: |
          set -euo pipefail
          PACKAGE=apps/desktop/out/Example-linux-amd64.deb
          EXTRACTED="$RUNNER_TEMP/example-deb"
          test "$(dpkg-deb -f "$PACKAGE" Architecture)" = amd64
          dpkg-deb -x "$PACKAGE" "$EXTRACTED"
          DESKTOP_ENTRY="$EXTRACTED/usr/share/applications/example-desktop.desktop"
          grep -Fxq 'Exec=/opt/Example/example-desktop %U' "$DESKTOP_ENTRY"
          grep -Fxq 'Icon=example-desktop' "$DESKTOP_ENTRY"
          test -f "$EXTRACTED/usr/share/icons/hicolor/256x256/apps/example-desktop.png"
          APP="$EXTRACTED/opt/Example"
          grep -Fxq deb "$APP/resources/package-type"

      - name: Verify RPM package
        run: |
          set -euo pipefail
          PACKAGE="$PWD/apps/desktop/out/rpm/Example-linux-x86_64.rpm"
          test "$(rpm -qp --qf '%{ARCH}' "$PACKAGE")" = x86_64
          rpm -qpl "$PACKAGE" > "$RUNNER_TEMP/example-rpm-files.txt"
          grep -Fxq '/usr/share/applications/example-desktop.desktop' "$RUNNER_TEMP/example-rpm-files.txt"
          grep -Fxq '/opt/Example/resources/app.asar' "$RUNNER_TEMP/example-rpm-files.txt"
          mkdir -p "$RUNNER_TEMP/example-rpm"
          (cd "$RUNNER_TEMP/example-rpm" && rpm2cpio "$PACKAGE" | cpio -id --quiet './opt/Example/resources/package-type')
          grep -Fxq rpm "$RUNNER_TEMP/example-rpm/opt/Example/resources/package-type"

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            apps/desktop/out/Example-linux-amd64.deb
            apps/desktop/out/Example-linux-x86_64.rpm
            apps/desktop/out/latest-linux.yml
          if-no-files-found: error

  desktop-windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    env:
      npm_config_script_shell: 'C:/Program Files/Git/bin/bash.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm --filter @example/desktop build

      - name: Package Example Desktop
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win nsis --x64 --publish never

      - name: Verify unsigned Windows installer and application archive
        shell: pwsh
        run: |
          foreach ($file in @(
            "apps/desktop/out/Example-windows-x64.exe",
            "apps/desktop/out/win-unpacked/Example.exe",
            "apps/desktop/out/win-unpacked/resources/app.asar"
          )) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Missing $file" }
          }

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: apps/desktop/out/Example-windows-x64.exe
          if-no-files-found: error

  desktop-publish:
    needs: [desktop-macos, desktop-linux, desktop-windows]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Publish complete release
        env:
          ARCNET_STANDARD_SECRETS_KEY: ${{ secrets.ARCNET_STANDARD_SECRETS_KEY }}
          ARCNET_PROJECT_SECRETS_KEY: ${{ secrets.ARCNET_PROJECT_SECRETS_KEY }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="desktop-v$VERSION"
          pnpm exec arcnet env run --consumer desktopRelease -- gh release create "$TAG" \
            release/Example-arm64.dmg release/Example-arm64.zip release/latest-mac.yml \
            release/Example-linux-amd64.deb release/Example-linux-x86_64.rpm release/latest-linux.yml \
            release/Example-windows-x64.exe \
            --repo "$DESKTOP_RELEASE_REPOSITORY" --title "$TAG" --draft
          pnpm exec arcnet env run --consumer desktopRelease -- gh release edit "$TAG" \
            --repo "$DESKTOP_RELEASE_REPOSITORY" --draft=false --latest
          # Add --linux --windows when using ArcNet 0.7.21 or later.
          pnpm exec arcnet desktop verify --repository "$DESKTOP_RELEASE_REPOSITORY"
