name: Release desktop
on:
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - run: pnpm install --frozen-lockfile
      - name: Check release version
        run: test "${GITHUB_REF_NAME}" = "desktop-v$(node -p "require('./apps/desktop/package.json').version")"
      - run: pnpm --filter @example/desktop typecheck
      - run: pnpm --filter @example/desktop build
      - name: Validate signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "Missing secret: $name" >&2; exit 1; }
          done
      - name: Package signed app
        run: pnpm --filter @example/desktop exec electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify artifacts
        run: |
          test -f apps/desktop/out/latest-mac.yml
          ls apps/desktop/out/*.dmg apps/desktop/out/*-mac.zip
          APP=$(find apps/desktop/out -path '*.app' -type d -print -quit)
          test -n "$APP"
          codesign --verify --deep --strict "$APP"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.zip
            apps/desktop/out/latest-mac.yml
          fail_on_unmatched_files: true
