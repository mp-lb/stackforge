name: Release desktop
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: blacksmith-6vcpu-macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - run: pnpm install --frozen-lockfile
      - name: Check release version
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "DESKTOP_RELEASE_TAG=desktop-v$VERSION" >> "$GITHUB_ENV"
      - run: pnpm --filter @example/desktop typecheck
      - run: pnpm --filter @example/desktop build
      - name: Load and validate signing credentials
        env:
          ARCNET_STANDARD_SECRETS_KEY: ${{ secrets.ARCNET_STANDARD_SECRETS_KEY }}
          ARCNET_PROJECT_SECRETS_KEY: ${{ secrets.ARCNET_PROJECT_SECRETS_KEY }}
        run: |
          set -euo pipefail
          pnpm exec arcnet env export --consumer desktop | pnpm exec code-signing github-env --stdin
      - name: Package signed app
        run: pnpm --filter @example/desktop exec electron-builder --mac --publish never
      - name: Verify artifacts
        run: |
          test -f apps/desktop/out/latest-mac.yml
          ls apps/desktop/out/*.dmg apps/desktop/out/*.zip
          APP=$(find apps/desktop/out -path '*.app' -type d -print -quit)
          test -n "$APP"
          codesign --verify --deep --strict "$APP"
          spctl --assess --type execute "$APP"
      - name: Publish public desktop release
        env:
          ARCNET_STANDARD_SECRETS_KEY: ${{ secrets.ARCNET_STANDARD_SECRETS_KEY }}
          ARCNET_PROJECT_SECRETS_KEY: ${{ secrets.ARCNET_PROJECT_SECRETS_KEY }}
        run: |
          set -euo pipefail
          # Configure desktopRelease with GH_TOKEN mapped to DESKTOP_RELEASES_GITHUB_TOKEN in standard secrets.
          pnpm exec arcnet env run --consumer desktopRelease -- gh release create "$DESKTOP_RELEASE_TAG" \
            apps/desktop/out/*.dmg apps/desktop/out/*.zip apps/desktop/out/latest-mac.yml \
            --repo mp-lb/example-releases --title "$DESKTOP_RELEASE_TAG"
