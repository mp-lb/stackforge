name: Release

# Release flow:
# 1. Feature PRs include a changeset (`npx changeset`).
# 2. When changesets land on main, the changesets action opens/updates a
#    "Version Packages" PR.
# 3. Merging that PR bumps package.json (app.config.ts mirrors it into the
#    Expo config), tags the commit, and triggers the deploy job.
# 4. The deploy job syncs env to EAS, then compares the native fingerprint
#    against existing EAS production builds: unchanged runtime ships as an OTA
#    update, changed runtime queues store builds with auto-submit.
#
# Secrets come from the shared encrypted file (docs/secrets.json.enc, synced
# from the felixsebastian/doctrine store). The only GitHub secret is
# SECRETS_KEY. tools-env-mapper exports the keys listed in env-map.yaml and
# masks secret-sourced values.
#
# The sync-eas-env job runs on every push to main (not just releases) so the
# EAS environment is always populated — including before the very first
# manual credentials-bootstrap build.
#
# workflow_dispatch is an escape hatch to force-deploy current main without a
# changeset (e.g. the very first release).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-main

jobs:
  changesets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Run from RUNNER_TEMP: the repo .npmrc routes the @mp-lb scope to
      # GitHub Packages, but these tools live on the public npm registry.
      - name: Decrypt shared secrets
        env:
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
        run: |
          cd "$RUNNER_TEMP"
          npx -y @mp-lb/doctrine-secrets decrypt "$GITHUB_WORKSPACE/docs/secrets.json.enc" --secret "$SECRETS_KEY" > "$RUNNER_TEMP/secrets.json"

      # Call the mapper's cli.js through node directly: the published bin
      # guard (`process.argv[1].endsWith("cli.js")`) silently no-ops when run
      # via the .bin symlink, e.g. through npx.
      - name: Load env (ci)
        run: |
          cd "$RUNNER_TEMP"
          npm install --prefix "$RUNNER_TEMP/env-mapper" @mp-lb/tools-env-mapper > /dev/null
          node "$RUNNER_TEMP/env-mapper/node_modules/@mp-lb/tools-env-mapper/dist/cli.js" github-env ci \
            --secrets "$RUNNER_TEMP/secrets.json" \
            --public "$GITHUB_WORKSPACE/.env.production" \
            --map "$GITHUB_WORKSPACE/env-map.yaml"

      - name: Install dependencies
        run: npm ci

      - name: Create version PR or tag release
        id: changesets
        uses: changesets/action@v1
        with:
          title: "Release"
          commit: "Release"
          publish: npx changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs on EVERY push to main, not just releases. The EAS environment must
  # exist before the first (manual, credentials-bootstrap) build — if this
  # only ran on deploy, builds kicked off before the first release would hit
  # an empty environment and fail installing the private package.
  sync-eas-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Decrypt shared secrets
        env:
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
        run: |
          cd "$RUNNER_TEMP"
          npx -y @mp-lb/doctrine-secrets decrypt "$GITHUB_WORKSPACE/docs/secrets.json.enc" --secret "$SECRETS_KEY" > "$RUNNER_TEMP/secrets.json"

      # Call the mapper's cli.js through node directly: the published bin
      # guard (`process.argv[1].endsWith("cli.js")`) silently no-ops when run
      # via the .bin symlink, e.g. through npx.
      - name: Load env (release)
        run: |
          cd "$RUNNER_TEMP"
          npm install --prefix "$RUNNER_TEMP/env-mapper" @mp-lb/tools-env-mapper > /dev/null
          node "$RUNNER_TEMP/env-mapper/node_modules/@mp-lb/tools-env-mapper/dist/cli.js" github-env release \
            --secrets "$RUNNER_TEMP/secrets.json" \
            --public "$GITHUB_WORKSPACE/.env.production" \
            --map "$GITHUB_WORKSPACE/env-map.yaml"

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Keep the EAS production environment in lockstep with env-map.yaml's
      # `eas` section so EAS builds and update bundles resolve the same values
      # as everything else. Single-line values only: the rendered file uses
      # GITHUB_ENV syntax, which matches dotenv for simple KEY=value pairs.
      - name: Sync env to EAS
        run: |
          node "$RUNNER_TEMP/env-mapper/node_modules/@mp-lb/tools-env-mapper/dist/cli.js" github-env eas \
            --secrets "$RUNNER_TEMP/secrets.json" \
            --public "$GITHUB_WORKSPACE/.env.production" \
            --map "$GITHUB_WORKSPACE/env-map.yaml" \
            --out "$RUNNER_TEMP/eas.env"
          # No --non-interactive: env:push rejects the flag; --force already
          # makes it overwrite without prompting.
          eas env:push production --path "$RUNNER_TEMP/eas.env" --force

  deploy:
    needs: [changesets, sync-eas-env]
    if: needs.changesets.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Decrypt shared secrets
        env:
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
        run: |
          cd "$RUNNER_TEMP"
          npx -y @mp-lb/doctrine-secrets decrypt "$GITHUB_WORKSPACE/docs/secrets.json.enc" --secret "$SECRETS_KEY" > "$RUNNER_TEMP/secrets.json"

      # Call the mapper's cli.js through node directly: the published bin
      # guard (`process.argv[1].endsWith("cli.js")`) silently no-ops when run
      # via the .bin symlink, e.g. through npx.
      - name: Load env (release)
        run: |
          cd "$RUNNER_TEMP"
          npm install --prefix "$RUNNER_TEMP/env-mapper" @mp-lb/tools-env-mapper > /dev/null
          node "$RUNNER_TEMP/env-mapper/node_modules/@mp-lb/tools-env-mapper/dist/cli.js" github-env release \
            --secrets "$RUNNER_TEMP/secrets.json" \
            --public "$GITHUB_WORKSPACE/.env.production" \
            --map "$GITHUB_WORKSPACE/env-map.yaml"

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Computes the native fingerprint per platform. If a production build
      # with this fingerprint already exists, it only publishes an EAS Update
      # (OTA). Otherwise it starts store builds and auto-submits them.
      - name: Deploy (OTA update or store build, decided by fingerprint)
        uses: expo/expo-github-action/continuous-deploy-fingerprint@v9
        with:
          profile: production
          branch: production
          platform: all
          environment: production
          auto-submit-builds: true
