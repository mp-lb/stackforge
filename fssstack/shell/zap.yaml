project: fss-shell
env-files:
  - .env.local
  - .env
homepage: http://localhost:${EXAMPLE_BACKEND_PORT}/health
ports:
  - EXAMPLE_BACKEND_PORT
native:
  example-backend:
    cmd: pnpm --filter @example/fss-shell-example-backend dev
    env: "*"
tasks:
  scripts:
    desc: Introduce this project
    cmds:
      - pnpm --dir packages/scripts exec tsx index.ts
  publish-packages:
    cmds:
      - pnpm exec tsx packages/scripts/autoPublish.ts {{REST}}
  verify-publication:
    cmds:
      - pnpm exec tsx packages/scripts/verifyPublication.ts
  augment-docs-site:
    cmds:
      - pnpm exec tsx packages/scripts/augmentDocsSite.ts {{REST}}
  scripts-test:
    cmds:
      - pnpm --dir packages/scripts test
  scripts-check:
    desc: Lint and typecheck project scripts
    cmds:
      - pnpm exec eslint packages/scripts
      - pnpm --dir packages/scripts run typecheck
  context-build:
    cmds:
      - pnpm exec tsx packages/scripts/contextFiles.ts build {{REST}}
  context-copy:
    cmds:
      - pnpm exec tsx packages/scripts/contextFiles.ts copy {{REST}}
  setup:
    cmds:
      - pnpm install
  build:
    cmds:
      - pnpm build
  lint:
    cmds:
      - |
        if [ -n "{{REST}}" ]; then
          pnpm exec eslint {{REST}}
        else
          pnpm lint
        fi
  check:
    cmds:
      - zap task lint -- {{REST}}
      - pnpm typecheck
  typecheck:
    cmds:
      - pnpm typecheck
  test:
    cmds:
      - pnpm test
  worktree-setup:
    cmds:
      - pnpm install
      - cp "$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")/.env" . 2>/dev/null || true
      - '[ ! -f AGENTS.base.md ] || zap task context-copy'
      - grep -qxF '@AGENTS_WORKTREE.md' AGENTS.md || printf '\n@AGENTS_WORKTREE.md\n' >> AGENTS.md
