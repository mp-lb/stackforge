name: Release npm packages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Set false for applications with no publishable packages; retain this workflow.
  PUBLISH_PACKAGES: "true"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'REPLACE_WITH_OWNER/REPOSITORY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm build
      - name: Publish changed package builds
        if: env.PUBLISH_PACKAGES == 'true'
        id: publish
        # fssstack-publish-command
        run: pnpm exec tsx packages/scripts/autoPublish.ts --github-output="$GITHUB_OUTPUT"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify exact public versions
        if: env.PUBLISH_PACKAGES == 'true'
        run: pnpm exec tsx packages/scripts/verifyPublication.ts
        env:
          FSSSTACK_RELEASE_RESULT: ${{ steps.publish.outputs.release_report }}
